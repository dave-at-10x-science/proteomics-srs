# Beginner visual concepts. Diagrams are original schematics, not to scale.
# Primary references:
# https://publications.iupac.org/pac/85/7/1515/index.html
# https://goldbook.iupac.org/terms/view/12495
# https://pubmed.ncbi.nlm.nih.gov/1309610/
set:
  id: ms-vocabulary
  name: Reading mass spectra
  default: false
  tags: [mass-spectrometry, proteomics, spectra]

note_type:
  id: Term
  fields:
    - {name: term, label: Name, type: text}
    - {name: image, label: Diagram, type: image, optional: true, detailed: true}
    - {name: short_form, label: Symbol or abbreviation, type: text, optional: true}
    - {name: definition, label: What it is, type: markdown}
    - {name: function, label: What it does, type: text, optional: true}
    - {name: key_fact, label: Key fact, type: text, optional: true}
    - {name: technical, label: Technical definition, type: markdown, optional: true}
    - {name: example, label: Example, type: markdown, optional: true}
  templates:
    # Keep these identities for history; new practice uses the visual directions below.
    - id: term-to-definition
      prompt: [term]
      answer: [definition]
      mode: flip
      enabled_by_default: false
    - id: definition-to-term
      prompt: [definition]
      answer: [term]
      mode: typed
      enabled_by_default: false
    - id: image-to-term
      prompt: [image]
      answer: [term]
      mode: multiple_choice
      enabled_by_default: true
    - id: term-to-image
      prompt: [term]
      answer: [image]
      mode: multiple_choice
      enabled_by_default: true

notes:
  - id: term-mz
    term: Mass-to-charge ratio
    image: /study/ms/mz.svg
    short_form: m/z
    definition: "An ion's mass divided by its charge number."
    function: Locate ions on a mass spectrum
    key_fact: Ion mass 1000 Da and 2+ gives 500.

  - id: term-charge-state
    term: Charge state
    image: /study/ms/charge-state.svg
    short_form: z
    definition: "How many elementary charges an ion carries."
    function: Describe an ion's charge
    key_fact: 2+ means two positive charges.

  - id: term-isotope-envelope
    term: Isotope envelope
    image: /study/ms/isotope-envelope.svg
    definition: "A group of peaks from different isotope compositions of the same ion."
    function: Recognize an ion's isotope pattern
    key_fact: More charges make isotope peaks closer.

  - id: term-monoisotopic-mass
    term: Monoisotopic mass
    image: /study/ms/monoisotopic-mass.svg
    definition: "Exact mass calculated with the most abundant isotope of each element."
    function: Define one isotope composition
    key_fact: Calculated from exact isotope masses.
