# Beginner visual concepts. Diagrams are original schematics, not to scale.
# Primary references:
# https://doi.org/10.1351/pac199365040819
# https://pubmed.ncbi.nlm.nih.gov/2774189/
# https://www.ssi.shimadzu.com/service-support/faq/maldi/maldi-basics/index.html
set:
  id: ms-ionization
  name: LC and ionization
  default: false
  tags: [mass-spectrometry, proteomics, ionization]

note_type:
  id: Term
  fields:
    - {name: term, label: Name, type: text}
    - {name: image, label: Diagram, type: image, optional: true, detailed: true}
    - {name: short_form, label: Symbol or abbreviation, type: text, optional: true}
    - {name: definition, label: What it is, type: markdown}
    - {name: function, label: What it does, type: text, optional: true}
    - {name: key_fact, label: Key fact, type: text, optional: true}
    - {name: technical, label: Technical definition, type: markdown, optional: true}
    - {name: example, label: Example, type: markdown, optional: true}
  templates:
    # Keep these identities for history; new practice uses the visual directions below.
    - id: term-to-definition
      prompt: [term]
      answer: [definition]
      mode: flip
      enabled_by_default: false
    - id: definition-to-term
      prompt: [definition]
      answer: [term]
      mode: typed
      enabled_by_default: false
    - id: image-to-term
      prompt: [image]
      answer: [term]
      mode: multiple_choice
      enabled_by_default: true
    - id: term-to-image
      prompt: [term]
      answer: [image]
      mode: multiple_choice
      enabled_by_default: true

notes:
  - id: term-lc
    term: Liquid chromatography
    image: /study/ms/lc.svg
    short_form: LC
    definition: "Separate a mixture as a liquid carries it through a stationary phase."
    function: Separate sample components
    key_fact: Components can elute at different times.

  - id: term-retention-time
    term: Retention time
    image: /study/ms/retention-time.svg
    short_form: tR
    definition: "Time from injection to a compound's chromatographic peak maximum."
    function: Locate a peak in time
    key_fact: Read from the chromatogram time axis.

  - id: term-esi
    term: Electrospray ionization
    image: /study/ms/esi.svg
    short_form: ESI
    definition: "Ionize a liquid sample by making charged droplets in an electric field."
    function: Produce gas-phase ions
    key_fact: Peptides often carry multiple charges.

  - id: term-maldi
    term: Matrix-assisted laser desorption/ionization
    image: /study/ms/maldi.svg
    short_form: MALDI
    definition: "Use a laser and a light-absorbing matrix to produce sample ions."
    function: Produce gas-phase ions
    key_fact: Sample and matrix are combined.
