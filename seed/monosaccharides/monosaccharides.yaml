# Recognise nine monosaccharides by their standard SNFG picture, name and abbreviation.
# Symbols, names and RGB colors: https://www.ncbi.nlm.nih.gov/glycans/snfg.html (Tables 1, 2, 4).
# Context: Essentials of Glycobiology, https://www.ncbi.nlm.nih.gov/books/NBK579927/,
# https://www.ncbi.nlm.nih.gov/books/NBK1917/ and https://www.ncbi.nlm.nih.gov/books/NBK579976/.
# Skeletal drawings use the explicit free cyclic forms identified below, not glycosidic residues.
# SNFG symbols do not specify anomeric configuration. Acid groups are shown neutral.

set:
  id: monosaccharides
  name: Monosaccharides for glycan analysis
  default: false
  tags: [glycans, glycomics, mass-spectrometry]

note_type:
  id: Monosaccharide
  fields:
    - {name: name, type: text}
    - {name: abbreviation, label: Abbreviation, type: text}
    - {name: shorthand, label: Composition class, type: text}
    - {name: symbol, label: SNFG symbol, type: image}
    - {name: abbreviation_alias, label: Also written, type: text, optional: true}
    - {name: note, label: Context, type: markdown, optional: true}
    - {name: chemical_structure, label: Skeletal structure, type: image, from: smiles, depiction_template: aldopyranose-ring, optional: true}
    - {name: smiles, label: Structure SMILES, type: smiles, optional: true}
    - {name: structure_form, label: Form shown, type: text, optional: true}
    # Keep old reference fields and template IDs so existing cards retain their history.
    - {name: residue_mass, label: Residue mass (monoisotopic), type: number, unit: Da, optional: true}
    - {name: formula, label: Residue formula, type: text, optional: true}
  depiction_templates:
    aldopyranose-ring:
      # Fix C1 and the ring orientation for the seven aldopyranoses without imposing stereochemistry.
      # The C3/C4 hydroxyl anchors exclude sialic acids, which use uncluttered automatic coordinates.
      smiles: "OC1OCC(O)C(O)C1"
      coords: [[3.0, 0.0], [1.5, 0.0], [0.75, 1.3], [-0.75, 1.3], [-1.5, 0.0], [-3.0, 0.0], [-0.75, -1.3], [-1.5, -2.6], [0.75, -1.3]]
  templates:
    - id: name-to-abbreviation
      prompt: [name]
      answer: [abbreviation]
      mode: typed
      accept: [abbreviation, abbreviation_alias]
    - id: name-to-symbol
      prompt: [name]
      answer: [symbol]
      mode: multiple_choice
    - id: symbol-to-name
      prompt: [symbol]
      answer: [name]
      mode: multiple_choice
    - id: name-to-shorthand
      prompt: [name]
      answer: [shorthand]
      mode: multiple_choice
      enabled_by_default: false
    - id: name-to-residue-mass
      prompt: [name]
      answer: [residue_mass]
      mode: typed
      tolerance: 0.01
      enabled_by_default: false

notes:
  - id: mono-glc
    name: Glucose
    abbreviation: Glc
    shorthand: Hex
    symbol: /study/monosaccharides/glc.svg
    note: "Shares the Hex composition class with mannose and galactose; the symbol distinguishes them."
    # https://www.ebi.ac.uk/chebi/CHEBI:15903
    smiles: "OC[C@H]1O[C@@H](O)[C@H](O)[C@@H](O)[C@@H]1O"
    structure_form: Free β-D-glucopyranose

  - id: mono-man
    name: Mannose
    abbreviation: Man
    shorthand: Hex
    symbol: /study/monosaccharides/man.svg
    note: "Three mannose residues form the shared core of animal N-glycans."
    # https://www.ebi.ac.uk/chebi/CHEBI:28563
    smiles: "OC[C@H]1O[C@@H](O)[C@@H](O)[C@@H](O)[C@@H]1O"
    structure_form: Free β-D-mannopyranose

  - id: mono-gal
    name: Galactose
    abbreviation: Gal
    shorthand: Hex
    symbol: /study/monosaccharides/gal.svg
    note: "Often extends the branches of complex N-glycans."
    # https://www.ebi.ac.uk/chebi/CHEBI:27667
    smiles: "OC[C@H]1O[C@@H](O)[C@H](O)[C@@H](O)[C@H]1O"
    structure_form: Free β-D-galactopyranose

  - id: mono-glcnac
    name: N-Acetylglucosamine
    abbreviation: GlcNAc
    shorthand: HexNAc
    symbol: /study/monosaccharides/glcnac.svg
    note: "The first sugar attached to asparagine in animal N-glycans."
    # https://www.ebi.ac.uk/chebi/CHEBI:28009
    smiles: "CC(=O)N[C@@H]1[C@@H](O)[C@H](O)[C@@H](CO)O[C@H]1O"
    structure_form: Free N-acetyl-β-D-glucosamine (pyranose)

  - id: mono-galnac
    name: N-Acetylgalactosamine
    abbreviation: GalNAc
    shorthand: HexNAc
    symbol: /study/monosaccharides/galnac.svg
    note: "Starts mucin-type O-glycans on serine or threonine."
    # https://www.ebi.ac.uk/chebi/CHEBI:28497
    smiles: "CC(=O)N[C@@H]1[C@@H](O)[C@@H](O)[C@@H](CO)O[C@H]1O"
    structure_form: Free N-acetyl-β-D-galactosamine (pyranose)

  - id: mono-fuc
    name: Fucose
    abbreviation: Fuc
    shorthand: dHex
    symbol: /study/monosaccharides/fuc.svg
    note: "A deoxyhexose, commonly found on the core of N-glycans."
    # https://www.ebi.ac.uk/chebi/CHEBI:42548
    smiles: "C[C@@H]1O[C@@H](O)[C@@H](O)[C@H](O)[C@@H]1O"
    structure_form: Free α-L-fucopyranose

  - id: mono-neuac
    name: N-Acetylneuraminic acid
    abbreviation: Neu5Ac
    abbreviation_alias: NeuAc
    shorthand: Sialic acid
    symbol: /study/monosaccharides/neu5ac.svg
    note: "The most common sialic acid in humans."
    # https://www.ebi.ac.uk/chebi/CHEBI:49026 (also CCD SIA / PubChem 444885)
    smiles: "[H][C@@]1([C@H](O)[C@H](O)CO)O[C@@](O)(C(=O)O)C[C@H](O)[C@H]1NC(C)=O"
    structure_form: Free α-D-Neu5Ac (pyranose)

  - id: mono-neugc
    name: N-Glycolylneuraminic acid
    abbreviation: Neu5Gc
    abbreviation_alias: NeuGc
    shorthand: Sialic acid
    symbol: /study/monosaccharides/neu5gc.svg
    note: "A sialic acid made by many mammals, but not synthesized by humans."
    # https://www.ebi.ac.uk/chebi/CHEBI:62269 (also CCD NGC / PubChem 9840259)
    smiles: "[H][C@@]1([C@H](O)[C@H](O)CO)O[C@@](O)(C(=O)O)C[C@H](O)[C@H]1NC(=O)CO"
    structure_form: Free α-D-Neu5Gc (pyranose)

  - id: mono-xyl
    name: Xylose
    abbreviation: Xyl
    shorthand: Pent
    symbol: /study/monosaccharides/xyl.svg
    note: "Links many glycosaminoglycan chains to their core protein."
    # https://www.ebi.ac.uk/chebi/CHEBI:28161
    smiles: "O[C@@H]1[C@@H](O)[C@H](O)OC[C@H]1O"
    structure_form: Free β-D-xylopyranose
