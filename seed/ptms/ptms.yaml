# Recognise representative protein modifications from before-and-after connectivity diagrams.
# Common sites are the examples taught here, not an exhaustive list of possible specificity.
# Chemistry and source records: https://www.unimod.org/modifications_view.php?editid1=<id>
# phospho 21; acetyl 1; methyl 34; dimethyl 36; trimethyl 37; oxidation 35;
# deamidation/citrullination 7; carbamidomethyl 4; GG 121; pyro-Glu from Gln 28;
# sulfo 40; succinyl 64; nitro 354.
# Context: https://pmc.ncbi.nlm.nih.gov/articles/PMC7077757/ (oxidation),
# https://pmc.ncbi.nlm.nih.gov/articles/pmid/21906983/ (GG remnants),
# https://pubmed.ncbi.nlm.nih.gov/9501187/ (sulfation),
# https://pmc.ncbi.nlm.nih.gov/articles/PMC3065206/ (succinylation).
# Regenerate SVGs with: cargo run -p srs-server --bin render_ptm_diagrams
# The retained SMILES describe each modified free amino acid, not the entire diagram.

set:
  id: ptms
  name: Post-translational modifications
  default: false
  tags: [ptm, mass-spectrometry, proteomics]

note_type:
  id: PTM
  fields:
    - {name: name, type: text}
    - {name: residues, label: Common sites, type: text}
    - {name: example, label: Example residue, type: text}
    - {name: structure, label: Before and after, type: image, optional: true, detailed: true}
    - {name: change, label: Chemical change, type: text}
    - {name: note, label: Context, type: markdown, optional: true}
    # Preserve legacy fields and template IDs without requiring advanced reference facts.
    - {name: smiles, label: Modified example SMILES, type: smiles, optional: true}
    - {name: mass_shift, label: Mass shift (monoisotopic), type: number, unit: Da, optional: true}
    - {name: composition, label: Composition change, type: text, optional: true}
    - {name: ms, label: In the mass spectrometer, type: markdown, optional: true}
  depiction_templates:
    amino-acid-backbone:
      smiles: "NCC(=O)O"
      coords: [[-1.3, -0.75], [0.0, 0.0], [1.3, -0.75], [1.3, -2.25], [2.6, 0.0]]
  templates:
    - id: structure-to-name
      prompt: [structure]
      answer: [name]
      mode: multiple_choice
    - id: name-to-structure
      prompt: [name]
      answer: [structure]
      mode: multiple_choice
    - id: name-to-residues
      prompt: [name]
      answer: [residues]
      mode: multiple_choice
    - id: name-to-mass-shift
      prompt: [name]
      answer: [mass_shift]
      mode: typed
      tolerance: 0.01
      enabled_by_default: false
    - id: mass-shift-to-name
      prompt: [mass_shift]
      answer: [name]
      mode: multiple_choice
      enabled_by_default: false
    - id: name-to-ms
      prompt: [name]
      answer: [ms]
      mode: flip
      enabled_by_default: false

notes:
  - id: ptm-phospho
    name: Phosphorylation
    residues: S, T, Y
    example: Serine (S)
    structure: /study/ptms/phospho.svg
    change: Attaches a phosphate group to a side-chain oxygen.
    note: "A common biological modification; this example shows serine."
    smiles: "C([C@@H](C(=O)O)N)OP(=O)(O)O"

  - id: ptm-acetyl
    name: Acetylation
    residues: K, protein N-terminus
    example: Lysine (K)
    structure: /study/ptms/acetyl.svg
    change: Adds an acetyl group to an amino group.
    note: "Occurs on lysine side chains and protein N-termini; this example shows lysine."
    smiles: "C(CCNC(C)=O)C[C@@H](C(=O)O)N"

  - id: ptm-methyl
    name: Methylation
    residues: K, R
    example: Lysine (K)
    structure: /study/ptms/methyl.svg
    change: Replaces one amino-group hydrogen with a methyl group.
    note: "This example shows a single methyl group on lysine."
    smiles: "C(CCNC)C[C@@H](C(=O)O)N"

  - id: ptm-dimethyl
    name: Dimethylation
    residues: K, R
    example: Lysine (K)
    structure: /study/ptms/dimethyl.svg
    change: Replaces two amino-group hydrogens with methyl groups.
    note: "This example shows two methyl groups on lysine; arginine has different dimethyl forms."
    smiles: "C(CCN(C)C)C[C@@H](C(=O)O)N"

  - id: ptm-trimethyl
    name: Trimethylation
    residues: K
    example: Lysine (K)
    structure: /study/ptms/trimethyl.svg
    change: Attaches three methyl groups to the lysine side-chain nitrogen.
    note: "The resulting quaternary ammonium group has a permanent positive charge."
    smiles: "C(CC[N+](C)(C)C)C[C@@H](C(=O)O)N"

  - id: ptm-oxidation
    name: Oxidation
    residues: M
    example: Methionine (M)
    structure: /study/ptms/oxidation.svg
    change: Adds oxygen to the methionine side-chain sulfur.
    note: "Can occur in cells or during sample handling; the picture alone does not establish its origin."
    smiles: "CS(=O)CC[C@@H](C(=O)O)N"

  - id: ptm-deamidation
    name: Deamidation
    residues: N, Q
    example: Asparagine (N)
    structure: /study/ptms/deamidation.svg
    change: Replaces a side-chain amide with a carboxyl group.
    note: "Often encountered during sample preparation; this example shows the Asp product, not isoAsp."
    smiles: "C([C@@H](C(=O)O)N)C(=O)O"

  - id: ptm-carbamidomethyl
    name: Carbamidomethylation
    residues: C
    example: Cysteine (C)
    structure: /study/ptms/carbamidomethyl.svg
    change: Adds a carbamidomethyl group to the cysteine sulfur.
    note: "Intentional sample preparation: alkylation caps the cysteine thiol."
    smiles: "C([C@@H](C(=O)O)N)SCC(N)=O"

  - id: ptm-gg
    name: Ubiquitination (GG remnant)
    residues: K
    example: Lysine (K)
    structure: /study/ptms/gg.svg
    change: Leaves two glycines on lysine after a protein tag is digested.
    note: "An analytical remnant, not intact ubiquitin; NEDD8 and ISG15 can leave the same remnant."
    smiles: "C(CCNC(=O)CNC(=O)CN)C[C@@H](C(=O)O)N"

  - id: ptm-citrullination
    name: Citrullination
    residues: R
    example: Arginine (R)
    structure: /study/ptms/citrullination.svg
    change: Turns arginine's guanidino group into a urea-like group.
    note: "A biological modification made by peptidylarginine deiminases (PADs)."
    smiles: "C(C[C@@H](C(=O)O)N)CNC(=O)N"

  - id: ptm-pyroglu
    name: Pyro-glu (from Gln)
    residues: N-terminal Q
    example: N-terminal glutamine
    structure: /study/ptms/pyroglu.svg
    change: The free N-terminus closes into a ring, releasing ammonia.
    note: "Requires a free N-terminus; this example starts from glutamine rather than glutamate."
    smiles: "C1CC(=O)N[C@@H]1C(=O)O"

  - id: ptm-sulfo
    name: Sulfation
    residues: Y
    example: Tyrosine (Y)
    structure: /study/ptms/sulfo.svg
    change: Attaches sulfate to the tyrosine side-chain oxygen.
    note: "A biological modification found on some secreted and cell-surface proteins."
    smiles: "C1=CC(=CC=C1C[C@@H](C(=O)O)N)OS(=O)(=O)O"

  - id: ptm-succinyl
    name: Succinylation
    residues: K
    example: Lysine (K)
    structure: /study/ptms/succinyl.svg
    change: Adds a four-carbon succinyl group to the lysine amino group.
    note: "The added carboxyl group is negatively charged near physiological pH."
    smiles: "C(CCNC(=O)CCC(=O)O)C[C@@H](C(=O)O)N"

  - id: ptm-nitro
    name: Nitration
    residues: Y
    example: Tyrosine (Y)
    structure: /study/ptms/nitro.svg
    change: Replaces a ring hydrogen with a nitro group next to tyrosine's OH.
    note: "Often studied as a sign of oxidative or nitrosative protein damage."
    smiles: "C1=CC(=C(C=C1C[C@@H](C(=O)O)N)[N+](=O)[O-])O"
