# Beginner visual concepts. Diagrams are original schematics, not to scale.
# Primary references:
# https://publications.iupac.org/pac/85/7/1515/index.html
# https://pmc.ncbi.nlm.nih.gov/articles/PMC3433915/
# https://pubmed.ncbi.nlm.nih.gov/11231557/
set:
  id: ms-acquisition
  name: MS scans and acquisition
  default: false
  tags: [mass-spectrometry, proteomics, acquisition]

note_type:
  id: Term
  fields:
    - {name: term, label: Name, type: text}
    - {name: image, label: Diagram, type: image, optional: true, detailed: true}
    - {name: short_form, label: Symbol or abbreviation, type: text, optional: true}
    - {name: definition, label: What it is, type: markdown}
    - {name: function, label: What it does, type: text, optional: true}
    - {name: key_fact, label: Key fact, type: text, optional: true}
    - {name: technical, label: Technical definition, type: markdown, optional: true}
    - {name: example, label: Example, type: markdown, optional: true}
  templates:
    # Keep these identities for history; new practice uses the visual directions below.
    - id: term-to-definition
      prompt: [term]
      answer: [definition]
      mode: flip
      enabled_by_default: false
    - id: definition-to-term
      prompt: [definition]
      answer: [term]
      mode: typed
      enabled_by_default: false
    - id: image-to-term
      prompt: [image]
      answer: [term]
      mode: multiple_choice
      enabled_by_default: true
    - id: term-to-image
      prompt: [term]
      answer: [image]
      mode: multiple_choice
      enabled_by_default: true

notes:
  - id: term-ms1
    term: MS1 survey scan
    image: /study/ms/ms1.svg
    short_form: MS1
    definition: "A scan measuring the m/z and signal of precursor ions before fragmentation."
    function: Survey precursor signals
    key_fact: Measures intact precursor ions.

  - id: term-tandem-ms
    term: Tandem mass spectrometry
    image: /study/ms/tandem-ms.svg
    short_form: MS/MS
    definition: "Select precursor ions, fragment them, and measure their product ions."
    function: Learn from fragment patterns
    key_fact: An MS2 spectrum measures product ions.

  - id: term-precursor
    term: Precursor ion
    image: /study/ms/precursor.svg
    definition: "An ion selected to form product ions in a later stage of MS."
    function: Start a fragmentation step
    key_fact: Isolation selects an m/z range.

  - id: term-dda
    term: Data-dependent acquisition
    image: /study/ms/dda.svg
    short_form: DDA
    definition: "Choose precursor ions for fragmentation using signals in a survey scan."
    function: Target selected precursors
    key_fact: Selection depends on observed signals.

  - id: term-dia
    term: Data-independent acquisition
    image: /study/ms/dia.svg
    short_form: DIA
    definition: "Collect fragments without choosing precursors by survey-scan intensity."
    function: Sample a planned precursor range
    key_fact: Often uses successive m/z windows.
