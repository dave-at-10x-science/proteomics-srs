[workspace]
resolver = "3"
members = ["crates/srs-core", "crates/srs-server"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
thiserror = "2"
